<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }
    #player {
        width: 100%;
        height: 100%;
    }
    #status {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font: 48px sans-serif;
        text-align: center;
        z-index: 10;
        pointer-events: none;
    }
</style>
</head>
<body>
<div id="player"></div>
<div id="status">Loading...</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get('u');
    const videoId = params.get('v') || 'dQw4w9WgXcQ';
    const startPaused = params.get('p') === '1';

    let controller = null;
    let pendingVolume = 100;
    let pendingPaused = startPaused;

    function setStatus(text) {
        document.getElementById('status').textContent = text;
    }

    function clampVolume(v) {
        return Math.max(0, Math.min(100, v));
    }

    function applyPending() {
        if (!controller) return;
        controller.setVolume(pendingVolume);
        if (pendingPaused) {
            controller.pause();
        } else {
            controller.play();
        }
    }

    function startVideoFile() {
        const el = document.createElement('video');
        el.src = videoUrl;
        el.loop = true;
        el.playsInline = true;
        el.style.cssText = 'width:100%;height:100%;object-fit:contain;background:#000';
        el.addEventListener('playing', () => setStatus(''));
        el.addEventListener('error', () => setStatus('Video error - check the link'));
        document.getElementById('player').appendChild(el);

        controller = {
            setVolume: (v) => { el.volume = clampVolume(v) / 100; },
            pause: () => el.pause(),
            play: () => {
                const p = el.play();
                if (p) p.catch(() => setStatus('Autoplay blocked'));
            },
        };
        applyPending();
    }

    function startYouTube() {
        window.onYouTubeIframeAPIReady = () => {
            const player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                videoId: videoId,
                playerVars: {
                    autoplay: startPaused ? 0 : 1,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    loop: 1,
                    playlist: videoId,
                },
                events: {
                    onError: (event) => {
                        setStatus('YouTube error ' + event.data);
                    },
                    onStateChange: (event) => {
                        if (event.data === 1) setStatus('');
                    },
                    onReady: () => {
                        setStatus('Player ready');
                        controller = {
                            setVolume: (v) => player.setVolume(clampVolume(v)),
                            pause: () => player.pauseVideo(),
                            play: () => player.playVideo(),
                        };
                        applyPending();
                    },
                },
            });
        };

        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        setTimeout(() => {
            if (!controller) setStatus('YouTube API failed to load');
        }, 8000);
    }

    window.addEventListener('message', (event) => {
        let data = event.data;
        if (typeof data === 'string') {
            try {
                data = JSON.parse(data);
            } catch (e) {
                return;
            }
        }
        if (!data || !data.type) return;

        if (data.type === 'volume') {
            pendingVolume = Math.round(data.volume * 100);
            if (controller) controller.setVolume(pendingVolume);
        } else if (data.type === 'pause') {
            pendingPaused = true;
            if (controller) controller.pause();
        } else if (data.type === 'resume') {
            pendingPaused = false;
            if (controller) controller.play();
        }
    });

    if (videoUrl) {
        startVideoFile();
    } else {
        startYouTube();
    }
</script>
</body>
</html>
